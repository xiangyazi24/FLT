name: Q4517 N18 Block4 inspection
on:
  push:
    branches: [q4517-check]
  pull_request:
    branches: [scratch]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Compile Q4517 reference
        shell: bash
        run: |
          set -euo pipefail
          git clone -q --depth 1 --branch q4517-check https://github.com/xiangyazi24/FLT.git repo
          cd repo
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y >/dev/null
          export PATH="$HOME/.elan/bin:$PATH"
          lake exe cache get >/dev/null 2>&1
          lake env lean FLTTest/Q4517Reference.lean