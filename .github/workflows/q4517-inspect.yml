name: Q4517 N18 Block4 inspection
on:
  push:
    branches: [q4517-check]
  pull_request:
    branches: [scratch]
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Compute local and composition data
        shell: bash
        run: |
          set -euo pipefail
          git clone -q --depth 1 --branch q4517-check https://github.com/xiangyazi24/FLT.git repo
          cd repo
          docker pull -q sagemath/sagemath:latest >/dev/null
          docker run --rm -v "$PWD/.github:/home/sage/work" -w /home/sage/work sagemath/sagemath:latest bash -lc 'sage q4517_local.sage; sage q4517_maps.sage'