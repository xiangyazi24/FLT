name: Q4517 N18 Block4 inspection
on:
  push:
    branches: [q4517-check]
  pull_request:
    branches: [scratch]
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect repository and compute explicit 3-isogeny data
        shell: bash
        run: |
          set -euo pipefail
          git clone -q --depth 1 --branch q4517-check https://github.com/xiangyazi24/FLT.git repo
          cd repo
          echo REPO_MATCHES_BEGIN
          grep -R -n -E 'structure IsogenyData|structure KummerData|n18Isogeny|n18Kummer|dualSelmerCode|phiSelmerCode|weak_three_descent|EVelu|E0PrimePinned' --include='*.lean' . | head -500 || true
          echo REPO_MATCHES_END
          docker pull -q sagemath/sagemath:latest >/dev/null
          docker run --rm -v "$PWD/.github:/home/sage/work" -w /home/sage/work sagemath/sagemath:latest sage q4517.sage