name: Q4318 Sage research

on:
  push:
    branches: [q4318-research]
  pull_request:
    branches: [scratch]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  compute:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      image: sagemath/sagemath:latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: q4318-research
      - name: Run Sage introspection
        shell: bash
        run: |
          set -o pipefail
          sage scratch/Q4318Sage.sage 2>&1 | tee scratch/Q4318Sage.out
      - name: Post output to temporary PR
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: gh pr comment 9 --body-file scratch/Q4318Sage.out
