name: Q4318 symbolic research

on:
  push:
    branches: [q4318-research]
    paths-ignore:
      - scratch/Q4318Research.out
  pull_request:
    branches: [scratch]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  compute:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: q4318-research
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install sympy
      - name: Run symbolic computation
        shell: bash
        run: |
          set -o pipefail
          python scratch/Q4318Research.py 2>&1 | tee scratch/Q4318Research.out
      - name: Commit output
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add scratch/Q4318Research.out
          git commit -m 'Record Q4318 symbolic output [skip ci]' || true
          git pull --rebase origin q4318-research || true
          git push origin HEAD:q4318-research
