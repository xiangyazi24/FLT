name: Q4318 symbolic research

on:
  push:
    branches: [q4318-research]
    paths-ignore:
      - scratch/Q4318Research.out
  pull_request:
    branches: [scratch]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compute:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: q4318-research
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install sympy
      - name: Run symbolic computation
        shell: bash
        run: |
          set -o pipefail
          python scratch/Q4318Research.py 2>&1 | tee scratch/Q4318Research.out
      - uses: actions/upload-artifact@v4
        with:
          name: q4318-symbolic-output
          path: scratch/Q4318Research.out
