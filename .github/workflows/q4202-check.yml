name: Q4202 Lean check

on:
  push:
    branches: [q4202-check]
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          auto-config: false
          use-mathlib-cache: true
      - name: Check Q4202
        run: lake env lean scratch/Q4202Check.lean
