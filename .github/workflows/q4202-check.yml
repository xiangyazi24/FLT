name: Q4202 Lean check

on:
  push:
    branches: [q4202-check]
    paths-ignore:
      - scratch/Q4202-errors.txt
  pull_request:
    branches: [scratch]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: q4202-check
      - uses: leanprover/lean-action@v1
        with:
          auto-config: false
          use-github-cache: true
          use-mathlib-cache: false
      - name: Fetch Mathlib cache
        run: lake exe cache get
      - name: Build Mathlib umbrella
        run: lake build Mathlib
      - name: Apply exact compiler fixes
        shell: bash
        run: |
          perl -0pi -e 's/M \+ \(-1\) \* N/M + N * (-1)/g' scratch/Q4202Check2.lean
          perl -0pi -e 's/have hQrest : IsCoprime \(Q16 M N\) \(2 \* N \* \(M - N\)\) := by\n    have ht := \(hQ2\.mul_right hQN\)\.mul_right hQD\n    convert ht using 1\n    ring/have hQrest : IsCoprime (Q16 M N) (2 * N * (M - N)) :=\n    (hQ2.mul_right hQN).mul_right hQD/' scratch/Q4202Check2.lean
          perl -0pi -e 's/have hdone : r\.den = 1 := by omega/have hdone : r.den = 1 := by\n    nlinarith [r.den_pos]/' scratch/Q4202Check2.lean
          perl -0pi -e 's/  · left\n    rw \[hu, hMneg\]\n    norm_num\n\ndef A16/  · left\n    rw [hu, hMneg]\n    field_simp [show (N : ℚ) ≠ 0 by exact_mod_cast hN0]\n\ndef A16/' scratch/Q4202Check2.lean
      - name: Check Q4202 and persist diagnostics
        shell: bash
        run: |
          set +e
          lake build scratch.Q4202Check2 > scratch/Q4202-errors.txt 2>&1
          status=$?
          printf '\nEXIT_STATUS=%s\n' "$status" >> scratch/Q4202-errors.txt
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add scratch/Q4202Check2.lean scratch/Q4202-errors.txt
          git commit -m 'Apply Q4202 Lean compiler fixes [skip ci]' || true
          git push origin HEAD:q4202-check
          exit "$status"
