name: Q996 direct Lean field_simp check

on:
  push:
    branches:
      - q996-calc-e02dbee8
    paths:
      - scripts/Q996FieldSimpCheck.lean
      - .github/workflows/q996-lean.yml

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: q996-calc-e02dbee8
          fetch-depth: 0

      - id: lean_setup
        continue-on-error: true
        uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: false
          test: false

      - id: lean_check
        name: Elaborate the exact field_simp certificate
        if: steps.lean_setup.outcome == 'success'
        continue-on-error: true
        run: lake env lean scripts/Q996FieldSimpCheck.lean > Q996_LEAN_LOG.txt 2>&1

      - name: Record direct Lean diagnostics
        if: always()
        env:
          SETUP_OUTCOME: ${{ steps.lean_setup.outcome }}
          CHECK_OUTCOME: ${{ steps.lean_check.outcome }}
        run: |
          {
            echo '# Q996 direct Lean diagnostics'
            echo
            echo "- lean-action setup: \`$SETUP_OUTCOME\`"
            echo "- exact certificate check: \`$CHECK_OUTCOME\`"
            echo
            echo '```text'
            if [ -f Q996_LEAN_LOG.txt ]; then cat Q996_LEAN_LOG.txt; else echo '(no Lean log was produced)'; fi
            echo '```'
          } > Q996_LEAN_DIAGNOSTICS.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Q996_LEAN_DIAGNOSTICS.md
          if ! git diff --cached --quiet; then
            git commit -m "Record Q996 Lean diagnostics"
            git push origin HEAD:q996-calc-e02dbee8
          fi

      - name: Require the direct certificate to pass
        if: always()
        env:
          SETUP_OUTCOME: ${{ steps.lean_setup.outcome }}
          CHECK_OUTCOME: ${{ steps.lean_check.outcome }}
        run: test "$SETUP_OUTCOME" = success && test "$CHECK_OUTCOME" = success
