name: Q996 direct Lean field_simp check

on:
  push:
    branches:
      - q996-calc-e02dbee8
    paths:
      - scripts/Q996FieldSimpCheck.lean
      - .github/workflows/q996-lean.yml

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: q996-calc-e02dbee8
          fetch-depth: 0

      - uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: false
          test: false

      - name: Elaborate the exact field_simp certificate
        run: lake env lean scripts/Q996FieldSimpCheck.lean

      - name: Record successful direct Lean verification
        run: |
          printf '%s\n' '# Q996 direct Lean verification' '' '- `field_simp` followed by `linear_combination (16 * y ^ 2 * C) * hcurve + (16 * y ^ 2 * C) * htors` elaborated successfully.' > Q996_LEAN_PASS.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Q996_LEAN_PASS.md
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Record direct Q996 Lean verification"
          git push origin HEAD:q996-calc-e02dbee8
