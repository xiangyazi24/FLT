name: Q4318 quotient fit final

on:
  push:
    branches: [q4318-uv-final]
    paths:
      - scratch/Q4318UVFinal.py
      - .github/workflows/q4318-uv-final.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  compute:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: q4318-uv-final
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install sympy
      - name: Fit invariant quotient coordinates
        shell: bash
        run: |
          set -o pipefail
          python scratch/Q4318UVFinal.py 2>&1 | tee scratch/Q4318UVFinal.out
      - name: Persist output
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          enc=$(base64 -w0 scratch/Q4318UVFinal.out)
          gh api --method PUT repos/${{ github.repository }}/contents/scratch/Q4318UVFinal.out \
            -f message='Record Q4318 quotient fit output [skip ci]' \
            -f content="$enc" \
            -f branch=q4318-uv-final
