name: Q990 SymPy certificate

on:
  push:
    branches:
      - q990-calc-1c48b827
    paths:
      - scripts/q990_compute_doubling_y.py
      - .github/workflows/q990-sympy.yml

permissions:
  contents: write

jobs:
  compute:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: q990-calc-1c48b827
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install exact SymPy version
        run: python -m pip install --disable-pip-version-check sympy==1.14.0

      - name: Compute and verify Q990 certificate
        run: python scripts/q990_compute_doubling_y.py > Q990_GENERATED.md

      - name: Commit exact generated report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Q990_GENERATED.md
          if git diff --cached --quiet; then
            echo "Generated report is unchanged."
            exit 0
          fi
          git commit -m "Record exact Q990 SymPy certificate"
          git push origin HEAD:q990-calc-1c48b827

# Triggered after registration on the default branch.
