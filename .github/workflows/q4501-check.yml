name: Q4501 reference compile
on:
  push:
    branches: [q4501-check]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Compile API check and reference
        shell: bash
        run: |
          set -euo pipefail
          git clone -q --depth 1 --branch q4501-check https://github.com/xiangyazi24/FLT.git repo
          cd repo
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y >/dev/null
          export PATH="$HOME/.elan/bin:$PATH"
          lake exe cache get >/dev/null 2>&1
          lake env lean FLTTest/Q4501ApiCheck.lean
          if [ -f FLTTest/Q4501Reference.lean ]; then lake env lean FLTTest/Q4501Reference.lean; fi
