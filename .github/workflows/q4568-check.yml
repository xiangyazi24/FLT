name: Q4568 arithmetic verification
on:
  push:
    branches: [q4568-check]
  pull_request:
    branches: [scratch]
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Verify cubic field arithmetic
        shell: bash
        run: |
          set -euo pipefail
          docker pull -q sagemath/sagemath:latest >/dev/null
          cat > /tmp/q4568.sage <<'SAGE'
          R.<T> = PolynomialRing(QQ)
          f = T^3 - 4*T^2 + 4*T - 2
          K.<a> = NumberField(f)
          OK = K.ring_of_integers()
          print('POLY', f)
          print('IRRED', f.is_irreducible())
          print('DISC_POLY', f.discriminant())
          print('DISC_FIELD', K.discriminant())
          print('OK_BASIS', OK.basis())
          for p in [2,3,11]:
              print('MOD_FACTOR', p, f.change_ring(GF(p)).factor())
              print('IDEAL_FACTOR', p, K.ideal(p).factor())
              for P,e in K.ideal(p).factor():
                  print('PRIME_DATA', p, P, 'e', e, 'f', P.residue_class_degree(), 'norm', P.norm())
          S.<A,B,x,s> = PolynomialRing(QQ)
          normAB = A^3 + 4*A^2*B + 4*A*B^2 + 2*B^3
          print('NORM_AB', normAB)
          print('NORM_DELTA', normAB(A=x-24*s,B=18*s))
          F11.<U> = PolynomialRing(GF(11))
          print('MOD11_EXPAND', (U-8)^2*(U-10))
          SAGE
          docker run --rm -v /tmp:/home/sage/work -w /home/sage/work sagemath/sagemath:latest sage q4568.sage
