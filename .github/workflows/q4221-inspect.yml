name: Q4221 inspect

on:
  pull_request:
    branches: [scratch]
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          auto-config: false
          use-github-cache: true
          use-mathlib-cache: false
      - name: Fetch Mathlib cache
        run: lake exe cache get
      - name: Build Mathlib umbrella
        run: lake build Mathlib
      - name: Probe scalar API
        run: lake env lean scratch/Q4221Probe2.lean
      - name: Compile Q4221 core
        run: lake env lean scratch/Q4221Core.lean
      - name: Compile Q4221 valuation layer
        run: lake env lean scratch/Q4221Valuation.lean
