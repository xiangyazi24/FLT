name: Q4263 check

on:
  push:
    branches: [q4221-finalcheck]
  pull_request:
    branches: [scratch]
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: q4221-finalcheck
      - uses: leanprover/lean-action@v1
        with:
          auto-config: false
          use-github-cache: true
          use-mathlib-cache: false
      - name: Fetch Mathlib cache
        run: lake exe cache get
      - name: Build Mathlib umbrella
        run: lake build Mathlib
      - name: Compile Q4263 proof
        run: lake env lean scratch/Q4263.lean
