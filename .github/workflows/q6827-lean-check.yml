name: Q6827 Lean check

on:
  push:
    branches:
      - q6827-lean-check-7771eae9
    paths:
      - Q6827Check.lean
      - .github/workflows/q6827-lean-check.yml

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - name: Set up Lean
        uses: leanprover/lean-action@v1
        with:
          build: false
          test: false
          lint: false
      - name: Check Q6827 and retain diagnostics
        shell: bash
        run: |
          set +e
          lake env lean Q6827Check.lean > Q6827Compiler.txt 2>&1
          status=$?
          cat Q6827Compiler.txt
          if [ "$status" -ne 0 ]; then
            git config user.name github-actions[bot]
            git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            git add -f Q6827Compiler.txt
            git commit -m "Record Q6827 compiler diagnostics [skip ci]"
            git push
          fi
          exit "$status"
