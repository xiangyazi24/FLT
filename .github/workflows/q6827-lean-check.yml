name: Q6827 Lean check

on:
  push:
    branches:
      - q6827-lean-check-7771eae9

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - name: Set up Lean
        uses: leanprover/lean-action@v1
        with:
          build: false
          test: false
          lint: false
      - name: Check Q6827
        run: lake env lean Q6827Check.lean
