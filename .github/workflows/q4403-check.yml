name: Q4403 Tate normal form check
on:
  push:
    branches: [q4403-check]
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Print Sutherland optimized model and map rows
        shell: bash
        run: |
          mkdir -p /tmp/suth && cd /tmp/suth
          curl -sSL https://export.arxiv.org/e-print/0811.0296 -o src.tar
          tar -xf src.tar
          echo 'OPTIMIZED_MODELS'
          sed -n '680,735p' torsion.tex
          echo 'BIRATIONAL_MAPS'
          sed -n '750,825p' torsion.tex
