name: Q4403 Tate normal form check
on:
  push:
    branches: [q4403-check]
  pull_request:
    branches: [scratch]
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Print every N=18 source row
        shell: bash
        run: |
          mkdir -p /tmp/suth && cd /tmp/suth
          curl -sSL https://export.arxiv.org/e-print/0811.0296 -o src.tar
          tar -xf src.tar
          grep -n '^18&' torsion.tex
          grep -n '18.*frac' torsion.tex || true
