name: Q4403 inverse map final
on:
  push:
    branches: [q4403-inverse-final]
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Run saturated inverse map
        shell: bash
        run: |
          curl -sSL https://raw.githubusercontent.com/xiangyazi24/FLT/q4403-inverse-final/.github/q4403_inverse.sage -o /tmp/q4403_inverse.sage
          docker pull -q sagemath/sagemath:latest >/dev/null
          docker run --rm -v /tmp:/home/sage/work -w /home/sage/work sagemath/sagemath:latest sage q4403_inverse.sage
