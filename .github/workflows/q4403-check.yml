name: Q4403 Tate normal form check
on:
  push:
    branches: [q4403-check]
  pull_request:
    branches: [scratch]
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Verify primitive order-18 equation
        shell: bash
        run: |
          curl -sSL https://raw.githubusercontent.com/xiangyazi24/FLT/cc4909b07b55d5f0bea79f8aefd9af35d01b2b95/.github/q4403_tate.sage -o /tmp/q4403_tate.sage
          docker pull -q sagemath/sagemath:latest >/dev/null
          docker run --rm -v /tmp:/home/sage/work -w /home/sage/work sagemath/sagemath:latest sage q4403_tate.sage
