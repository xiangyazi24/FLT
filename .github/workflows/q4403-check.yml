name: Q4403 Tate normal form check
on:
  push:
    branches: [q4403-check]
  pull_request:
    branches: [scratch]
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Print exact source rows
        shell: bash
        run: |
          mkdir -p /tmp/suth && cd /tmp/suth
          curl -sSL https://export.arxiv.org/e-print/0811.0296 -o src.tar
          tar -xf src.tar
          echo 'OPT_MODEL'
          sed -n '704,716p' torsion.tex
          echo 'MAP_ROW'
          sed -n '780,794p' torsion.tex
          echo 'TATE_VARIABLES'
          sed -n '128,185p' torsion.tex
