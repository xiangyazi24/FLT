name: Q4403 Tate normal form check
on:
  push:
    branches: [q4403-check]
  pull_request:
    branches: [scratch]
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Inspect Sutherland TeX source
        shell: bash
        run: |
          mkdir -p /tmp/suth && cd /tmp/suth
          curl -sSL https://export.arxiv.org/e-print/0811.0296 -o src.tar
          tar -xf src.tar
          echo 'RAW_X1_ROWS'
          sed -n '570,615p' torsion.tex
          echo 'FINAL_X1_ROWS'
          sed -n '690,725p' torsion.tex
          echo 'FINAL_MAP_ROWS'
          sed -n '770,805p' torsion.tex
          echo 'BC_FORMULAS'
          sed -n '120,190p' torsion.tex
      - name: Run Sage Tate computation
        shell: bash
        run: |
          curl -sSL https://raw.githubusercontent.com/xiangyazi24/FLT/q4403-check/.github/q4403_tate.sage -o /tmp/q4403_tate.sage
          docker pull -q sagemath/sagemath:latest >/dev/null
          docker run --rm -v /tmp:/home/sage/work -w /home/sage/work sagemath/sagemath:latest sage q4403_tate.sage
