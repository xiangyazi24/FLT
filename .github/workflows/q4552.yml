name: Q4552 direct descent formula inspection
on:
  push:
    branches: [q4517-check]
  pull_request:
    branches: [scratch]
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Solve explicit cube-preimage formulas
        shell: bash
        run: |
          set -euo pipefail
          git clone -q --depth 1 --branch q4517-check https://github.com/xiangyazi24/FLT.git repo
          cd repo
          docker pull -q sagemath/sagemath:latest >/dev/null
          docker run --rm -v "$PWD/.github:/home/sage/work" -w /home/sage/work sagemath/sagemath:latest sage q4552_formula.sage
