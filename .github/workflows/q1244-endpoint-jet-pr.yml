name: Q1244 endpoint jet exact search

on:
  pull_request:
    branches: [main]
    paths:
      - scripts/q1244_endpoint_jet_search.cpp

permissions:
  contents: write
  pull-requests: read

jobs:
  search:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: q1244-endpoint-jet-search
          fetch-depth: 0
      - name: Compile exact C++ recurrence search
        run: g++ -O3 -std=c++20 -Wall -Wextra -pedantic scripts/q1244_endpoint_jet_search.cpp -o /tmp/q1244_search
      - name: Run search
        run: /tmp/q1244_search > Q1244_ENDPOINT_JET_RESULT.txt
      - name: Commit result to calculation branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Q1244_ENDPOINT_JET_RESULT.txt
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Record Q1244 endpoint-jet search result"
          git push origin HEAD:q1244-endpoint-jet-search
