name: Q4318 descent search

on:
  push:
    branches: [q4318-research]
    paths:
      - scratch/Q4318Descent.py
      - .github/workflows/q4318-descent.yml
  pull_request:
    branches: [scratch]
    paths:
      - scratch/Q4318Descent.py
      - .github/workflows/q4318-descent.yml
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  compute:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: q4318-research
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run descent search
        shell: bash
        run: |
          set -o pipefail
          python scratch/Q4318Descent.py 2>&1 | tee scratch/Q4318Descent.out
      - name: Expose output in fixed comment
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          jq -Rs '{body:.}' scratch/Q4318Descent.out |
            gh api --method PATCH repos/xiangyazi24/FLT/issues/comments/4949021361 --input -
