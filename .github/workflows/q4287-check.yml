name: Q4287 check

on:
  push:
    branches: [q4287-check]
    paths-ignore:
      - scratch/Q4287-output.txt
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: q4287-check
      - uses: leanprover/lean-action@v1
        with:
          auto-config: false
          use-github-cache: true
          use-mathlib-cache: false
      - name: Fetch Mathlib cache
        run: lake exe cache get
      - name: Build Mathlib umbrella
        run: lake build Mathlib
      - name: Compile Q4287 and persist diagnostics
        shell: bash
        run: |
          set +e
          lake env lean scratch/Q4287.lean > scratch/Q4287-output.txt 2>&1
          status=$?
          printf '\nEXIT_STATUS=%s\n' "$status" >> scratch/Q4287-output.txt
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add scratch/Q4287-output.txt
          git commit -m 'Record Q4287 diagnostics [skip ci]' || true
          git push origin HEAD:q4287-check
          exit "$status"
