name: Q4318 isogeny derivation

on:
  push:
    branches: [q4318-research]
    paths:
      - scratch/Q4318Isogeny.py
      - .github/workflows/q4318-isogeny.yml
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  compute:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: q4318-research
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install sympy
      - name: Run isogeny derivation
        shell: bash
        run: |
          set -o pipefail
          python scratch/Q4318Isogeny.py 2>&1 | tee scratch/Q4318Isogeny.out
      - name: Post output
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh pr comment 9 --body-file scratch/Q4318Isogeny.out
