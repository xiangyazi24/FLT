name: Q4323 arithmetic check
on:
  push:
    branches: [q4323-check]
  pull_request:
    branches: [scratch]
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install PARI
        run: sudo apt-get update -qq >/dev/null && sudo apt-get install -y pari-gp >/dev/null
      - name: Q4323 PARI results
        run: gp -q .github/q4323.gp
