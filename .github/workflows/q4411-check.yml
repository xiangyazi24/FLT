name: Q4411 compile check
on:
  push:
    branches: [q4411-check]
  pull_request:
    branches: [scratch]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Compile Q4411 scratch
        shell: bash
        run: |
          set -e
          git clone -q --depth 1 --branch q4411-check https://github.com/xiangyazi24/FLT.git repo
          cd repo
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y >/dev/null
          export PATH="$HOME/.elan/bin:$PATH"
          lake exe cache get >/dev/null 2>&1
          set +e
          lake env lean FLTTest/Q4411Scratch.lean >/tmp/q4411.log 2>&1
          rc=$?
          if [ "$rc" -ne 0 ]; then
            cat /tmp/q4411.log
          else
            echo Q4411_COMPILE_PASS
          fi
          exit $rc
