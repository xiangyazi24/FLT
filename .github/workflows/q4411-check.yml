name: Q4411 compile check
on:
  push:
    branches: [q4411-check]
  pull_request:
    branches: [scratch]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean4-action@v1
        with:
          build-args: FLTTest.Q4411Scratch
