name: Q4411 compile check
on:
  push:
    branches: [q4411-check]
  pull_request:
    branches: [scratch]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Lean
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y >/dev/null
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Fetch Mathlib cache
        run: lake exe cache get >/dev/null
      - name: Compile Q4411 scratch
        shell: bash
        run: |
          set +e
          lake env lean FLTTest/Q4411Scratch.lean >/tmp/q4411.log 2>&1
          rc=$?
          if [ "$rc" -ne 0 ]; then
            grep -n -E 'error:|unsolved goals|type mismatch|application type mismatch|unknown identifier|unexpected token' -A8 -B2 /tmp/q4411.log || cat /tmp/q4411.log
          else
            echo Q4411_COMPILE_PASS
          fi
          exit $rc
