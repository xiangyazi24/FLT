name: Q4358 lambda Selmer check
on:
  push:
    branches: [q4358-check]
  pull_request:
    branches: [scratch]
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Symbolic cyclic-cover model
        shell: bash
        run: |
          sudo apt-get update -qq >/dev/null
          sudo apt-get install -y pari-gp >/dev/null
          cat >/tmp/model.gp <<'GP'
          zz=Mod(z,z^2+z+1);
          ss=1+2*zz;
          g1=(3+2*ss)/7; g2=ss; g3=(3-2*ss)/7; g4=-ss;
          C=(g2-g4)/(g2-g3);
          uu=3*C*(m-g3)/(m-g4);
          tt=(-m^2-6*m+3)/(m^2-1);
          RR=(tt-3*zz)*(tt-3*zz^2)^2;
          print("GAMMAS=",g1," ; ",g2," ; ",g3," ; ",g4);
          print("CROSS_U=",lift(uu));
          numu=numerator(uu); denu=denominator(uu);
          /* solve U*denu=numu linearly for m, using q as a formal variable */
          eq=subst(numu-u*denu,m,m);
          mm=-polcoef(eq,0,m)/polcoef(eq,1,m);
          print("M_OF_U=",lift(mm));
          Ru=subst(RR,m,mm);
          print("R_U_RAW=",lift(Ru));
          quit;
          GP
          gp -q /tmp/model.gp
      - name: Check Sage availability
        shell: bash
        run: |
          apt-cache policy sagemath | head -20
