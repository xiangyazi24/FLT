name: Q4358 lambda Selmer check
on:
  push:
    branches: [q4358-check]
  pull_request:
    branches: [scratch]
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Run Sage finite local witnesses
        shell: bash
        run: |
          curl -sSL https://raw.githubusercontent.com/xiangyazi24/FLT/q4358-check/.github/q4358_witness.sage -o /tmp/q4358_witness.sage
          docker pull -q sagemath/sagemath:latest >/dev/null
          set +e
          docker run --rm -v /tmp:/home/sage/work -w /home/sage/work sagemath/sagemath:latest sage q4358_witness.sage > /tmp/q4358.out 2>&1
          rc=$?
          cat /tmp/q4358.out
          exit $rc
