name: Q4358 lambda Selmer check
on:
  push:
    branches: [q4358-check]
  pull_request:
    branches: [scratch]
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Run Sage local Kummer enumeration
        shell: bash
        run: |
          docker pull sagemath/sagemath:latest
          docker run --rm -v "$PWD:/home/sage/work" -w /home/sage/work sagemath/sagemath:latest sage .github/q4358_local.sage
