name: Q974 SymPy certificate

on:
  push:
    branches:
      - q974-calc-b4f28945
    paths:
      - scripts/q974_compute_nonhat_x.py
      - .github/workflows/q974-sympy.yml

permissions:
  contents: write

jobs:
  compute:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: q974-calc-b4f28945
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install exact SymPy version
        run: python -m pip install --disable-pip-version-check sympy==1.14.0

      - name: Compute and verify Q974 certificate
        run: python scripts/q974_compute_nonhat_x.py > Q974_GENERATED.md

      - name: Commit exact generated report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Q974_GENERATED.md
          if git diff --cached --quiet; then
            echo "Generated report is unchanged."
            exit 0
          fi
          git commit -m "Compute Q974 exact SymPy certificate"
          git push origin HEAD:q974-calc-b4f28945
