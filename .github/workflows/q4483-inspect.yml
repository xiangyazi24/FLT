name: Q4483 X1(25) quotient inspection
on:
  push:
    branches: [q4483-check]
  pull_request:
    branches: [scratch]
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Compute intermediate quotient and Jacobian data
        shell: bash
        run: |
          set -euo pipefail
          git clone -q --depth 1 --branch q4483-check https://github.com/xiangyazi24/FLT.git repo
          docker pull -q sagemath/sagemath:latest >/dev/null
          docker run --rm -v "$PWD/repo/.github:/home/sage/work" -w /home/sage/work sagemath/sagemath:latest bash -lc 'sage q4483.sage; sage q4483_jac.sage'
