name: Q6373 Lean check

on:
  push:
    branches: [q6373-check]
    paths-ignore:
      - scratch/Q6373-errors.txt
  pull_request:
    branches: [ai-scratch]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: q6373-check
      - uses: leanprover/lean-action@v1
        with:
          auto-config: false
          use-github-cache: true
          use-mathlib-cache: false
      - name: Fetch Mathlib cache
        run: lake exe cache get
      - name: Check Q6373 source and persist diagnostics
        shell: bash
        run: |
          set +e
          lake build scratch.Q6373Check > scratch/Q6373-errors.txt 2>&1
          status=$?
          printf '\nEXIT_STATUS=%s\n' "$status" >> scratch/Q6373-errors.txt
          git config user.name github-actions[bot]
          git config user.email 41898282+users.noreply.github.com
          git add scratch/Q6373-errors.txt
          git commit -m 'Capture Q6373 Lean diagnostics [skip ci]' || true
          git push origin HEAD:q6373-check
          exit "$status"
