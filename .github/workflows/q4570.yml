name: Q4570 arithmetic investigation
on:
  push:
    branches: [q4570-check]
  pull_request:
    branches: [scratch]
  workflow_dispatch:

jobs:
  investigate:
    runs-on: ubuntu-latest
    steps:
      - name: Compute minimal model, torsion, and halving identities
        shell: bash
        run: |
          set -euo pipefail
          git clone -q --depth 1 --branch q4570-check https://github.com/xiangyazi24/FLT.git repo
          docker pull -q sagemath/sagemath:latest >/dev/null
          docker run --rm -v "$PWD/repo/.github:/home/sage/work" -w /home/sage/work sagemath/sagemath:latest bash -lc 'sage q4570.sage; sage q4570_verify.sage'
