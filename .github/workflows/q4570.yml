name: Q4570 arithmetic investigation
on:
  push:
    branches: [q4570-check]
  pull_request:
    branches: [scratch]
  workflow_dispatch:

jobs:
  investigate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compute minimal model, torsion, and halving identities
        shell: bash
        run: |
          set -euo pipefail
          docker pull -q sagemath/sagemath:latest >/dev/null
          docker run --rm -v "$PWD/.github:/home/sage/work" -w /home/sage/work sagemath/sagemath:latest sage q4570.sage
