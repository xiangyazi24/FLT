name: Q4469 N49 inspection
on:
  push:
    branches: [q4469-check]
  pull_request:
    branches: [scratch]
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Compute concise N49 data
        shell: bash
        run: |
          set -euo pipefail
          git clone -q --depth 1 --branch q4469-check https://github.com/xiangyazi24/FLT.git repo
          cd repo
          echo REPO_MATCHES_BEGIN
          grep -R -n -E "RawOrder49TateObstruction|no_raw_order49_tate_obstruction|preΨ'|prePsi|preΨ|TateNormal|tateM" --include='*.lean' . | head -200 || true
          echo REPO_MATCHES_END
          docker pull -q sagemath/sagemath:latest >/dev/null
          docker run --rm -v "$PWD/.github:/home/sage/work" -w /home/sage/work sagemath/sagemath:latest sage q4469.sage
