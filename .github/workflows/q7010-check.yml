name: q7010-check
on:
  push:
    branches: [q7010-check-45756456]
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install PARI/GP and NumPy
        run: |
          sudo apt-get update
          sudo apt-get install -y pari-gp python3-numpy
      - name: Run Q7010 cusp checker
        run: python3 review/q7010_cusps.py
      - name: Run Q7010 exact local checker
        run: gp -q review/q7010_check.gp
      - name: Run Q7010 bounded global search
        run: python3 review/q7010_search.py
