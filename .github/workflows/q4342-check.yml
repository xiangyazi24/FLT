name: Q4342 structural check
on:
  push:
    branches: [q4342-check]
  pull_request:
    branches: [scratch]
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Explicit involution quotient
        shell: bash
        run: |
          sudo apt-get update -qq >/dev/null
          sudo apt-get install -y pari-gp >/dev/null
          cat >/tmp/q4342.gp <<'GP'
          f=x^6+4*x^5+10*x^4+10*x^3+5*x^2+2*x+1;
          aa=Mod(t,t^3-3*t-1);
          A=-aa-1;
          q=aa^2-1;
          rp=A+q;
          rm=A-q;
          den=x-A;
          sx=(A*x-aa)/den;
          print("Q4342_QUOTIENT_BEGIN");
          print("A=",lift(A)," Q=",lift(q)," RPLUS=",lift(rp)," RMINUS=",lift(rm));
          print("INVOLUTION_ID=",lift(den^6*subst(f,x,sx)-q^6*f));
          zfun=(x-rp)/(x-rm);
          print("Z_ANTI_INVARIANT=",lift(subst(zfun,x,sx)+zfun));
          xz=(z*rm-rp)/(z-1);
          Fz=(z-1)^6*subst(f,x,xz);
          print("EVEN_SEXTIC=",lift(Fz));
          print("Q4342_QUOTIENT_END");
          quit;
          GP
          gp -q /tmp/q4342.gp
      - name: Exact quotient normalizations
        shell: bash
        run: |
          curl -sSL https://raw.githubusercontent.com/xiangyazi24/FLT/q4342-check/.github/q4389_quotients.sage -o /tmp/q4389_quotients.sage
          docker pull -q sagemath/sagemath:latest >/dev/null
          docker run --rm -v /tmp:/home/sage/work -w /home/sage/work sagemath/sagemath:latest sage q4389_quotients.sage
