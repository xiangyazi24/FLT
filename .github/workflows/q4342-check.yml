name: Q4342 structural check
on:
  push:
    branches: [q4342-check]
  pull_request:
    branches: [scratch]
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Install PARI
        run: |
          sudo apt-get update -qq >/dev/null
          sudo apt-get install -y pari-gp >/dev/null
      - name: Frobenius and involution calculations
        shell: bash
        run: |
          cat >/tmp/q4342.gp <<'GP'
          f=x^6+4*x^5+10*x^4+10*x^3+5*x^2+2*x+1;
          print("Q4342_PARI_BEGIN");
          forprime(p=5,43,
            if(p!=2 && p!=3,
              P=lift(hyperellcharpoly(Mod(1,p)*f));
              print("P=",p," CHARPOLY=",P," FACTOR=",factor(P)," JORDER=",subst(P,x,1));
            )
          );
          aa=Mod(t,t^3-3*t-1);
          den=x+aa+1;
          sx=(-(aa+1)*x-aa)/den;
          q=aa^2-1;
          R=den^6*subst(f,x,sx)-q^6*f;
          print("INVOLUTION_POLY_IDENTITY=",lift(R));
          s2=subst(sx,x,sx);
          print("INVOLUTION_X_SQUARE=",lift(s2-x));
          print("Q4342_PARI_END");
          quit;
          GP
          gp -q /tmp/q4342.gp
