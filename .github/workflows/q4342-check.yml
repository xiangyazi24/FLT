name: Q4342 structural check
on:
  push:
    branches: [q4342-check]
  pull_request:
    branches: [scratch]
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Install PARI and PostgreSQL client
        run: |
          sudo apt-get update -qq >/dev/null
          sudo apt-get install -y pari-gp postgresql-client >/dev/null
      - name: Exact modular and endomorphism data
        env:
          PGPASSWORD: lmfdb
        shell: bash
        run: |
          set -euo pipefail
          DB='postgresql://lmfdb@devmirror.lmfdb.xyz:5432/lmfdb'
          echo Q4342_MF
          psql "$DB" -X -A -F '|' -t -c "SELECT label,dim,nf_label,field_poly,field_disc,char_order,char_conductor,is_cm,is_rm,is_self_twist,self_twist_type,inner_twist_count,inner_twists,has_non_self_twist,analytic_rank,analytic_rank_proved,relative_dim,sato_tate_group FROM mf_newforms WHERE label='18.2.c.a';"
          echo Q4342_ENDO_BASE
          psql "$DB" -X -A -F '|' -t -c "SELECT factorsRR_base,factorsQQ_base,is_simple_base,ring_base,st_group_base FROM g2c_endomorphisms WHERE label='324.a.648.1';"
          echo Q4342_ENDO_GEOM
          psql "$DB" -X -A -F '|' -t -c "SELECT factorsRR_geom,factorsQQ_geom,is_simple_geom,ring_geom,st_group_geom FROM g2c_endomorphisms WHERE label='324.a.648.1';"
          echo Q4342_FIELDS
          psql "$DB" -X -A -F '|' -t -c "SELECT fod_label,fod_coeffs,spl_fod_label,spl_fod_coeffs,spl_fod_gen,spl_facs_labels,spl_facs_coeffs,spl_facs_condnorms,lattice FROM g2c_endomorphisms WHERE label='324.a.648.1';"
          echo Q4342_G2_COLUMNS
          psql "$DB" -X -A -t -c "SELECT column_name FROM information_schema.columns WHERE table_name='g2c_curves' AND (column_name LIKE '%rank%' OR column_name LIKE '%tors%' OR column_name LIKE '%selmer%' OR column_name LIKE '%sha%' OR column_name LIKE '%st_%' OR column_name LIKE '%end%' OR column_name='eqn' OR column_name='label') ORDER BY ordinal_position;"
          echo Q4342_G2_SHORT
          psql "$DB" -X -A -t -c "SELECT row_to_json(t) FROM (SELECT label,eqn,analytic_rank,torsion,two_selmer_rank,analytic_sha,st_group FROM g2c_curves WHERE label='324.a.648.1') t;" || true
      - name: Frobenius polynomials and split tests
        shell: bash
        run: |
          cat >/tmp/q4342.gp <<'GP'
          f=x^6+4*x^5+10*x^4+10*x^3+5*x^2+2*x+1;
          print("Q4342_PARI_BEGIN");
          forprime(p=5,43,
            if(p!=2 && p!=3,
              P=lift(hyperellcharpoly(Mod(1,p)*f));
              print("P=",p," CHARPOLY=",P," FACTOR=",factor(P)," JORDER=",subst(P,x,1));
            )
          );
          print("Q4342_PARI_END");
          quit;
          GP
          gp -q /tmp/q4342.gp
