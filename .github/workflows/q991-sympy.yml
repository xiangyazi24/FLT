name: Q991 SymPy hat Y-coordinate audit

on:
  push:
    branches:
      - q991-calc-0c951284
    paths:
      - scripts/q991_compute_hat_y.py
      - scripts/q991_compact_certificate.py
      - scripts/q991_hat_y_final.py
      - .github/workflows/q991-sympy.yml

permissions:
  contents: write

jobs:
  compute:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: q991-calc-0c951284
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install exact SymPy version
        run: python -m pip install --disable-pip-version-check sympy==1.14.0

      - name: Compute and verify Q991 certificate
        run: python scripts/q991_hat_y_final.py > Q991_GENERATED.md

      - name: Commit exact generated report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Q991_GENERATED.md
          if git diff --cached --quiet; then
            echo "Generated report is unchanged."
            exit 0
          fi
          git commit -m "Record exact Q991 hat Y-coordinate certificate"
          git push origin HEAD:q991-calc-0c951284
