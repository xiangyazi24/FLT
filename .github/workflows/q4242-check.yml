name: Q4242 Lean check

on:
  push:
    branches: [q4242-check]
    paths-ignore:
      - scratch/Q4242-errors.txt
  pull_request:
    branches: [scratch]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: q4242-check
      - uses: leanprover/lean-action@v1
        with:
          auto-config: false
          use-github-cache: true
          use-mathlib-cache: false
      - name: Fetch Mathlib cache
        run: lake exe cache get
      - name: Build Mathlib umbrella
        run: lake build Mathlib
      - name: Check Q4242 and persist diagnostics
        shell: bash
        run: |
          set +e
          : > scratch/Q4242-errors.txt
          lake env lean scratch/Q4242Core.lean >> scratch/Q4242-errors.txt 2>&1
          status1=$?
          lake env lean scratch/Q4242Finite.lean >> scratch/Q4242-errors.txt 2>&1
          status2=$?
          lake env lean scratch/Q4242Points.lean >> scratch/Q4242-errors.txt 2>&1
          status3=$?
          lake env lean scratch/Q4242Counterexample.lean >> scratch/Q4242-errors.txt 2>&1
          status4=$?
          status=$((status1 || status2 || status3 || status4))
          printf '\nEXIT_STATUS=%s\n' "$status" >> scratch/Q4242-errors.txt
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add scratch/Q4242-errors.txt
          git commit -m 'Record Q4242 compiler diagnostics [skip ci]' || true
          git push origin HEAD:q4242-check
          exit "$status"
