name: Q4518 N18 fiber certificate
on:
  push:
    branches: [q4518-check]
  pull_request:
    branches: [scratch]
  workflow_dispatch:
jobs:
  compute:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Run exact Sage fiber computation
        shell: bash
        run: |
          curl -sSL https://raw.githubusercontent.com/xiangyazi24/FLT/q4518-check/.github/q4518_fibers.sage -o /tmp/q4518_fibers.sage
          docker pull -q sagemath/sagemath:latest >/dev/null
          docker run --rm -v /tmp:/home/sage/work -w /home/sage/work sagemath/sagemath:latest sage q4518_fibers.sage
